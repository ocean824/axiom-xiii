name: Validate repository foundation

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - develop

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate canonical source and control artifacts
        run: python3 tools/validate_repository.py

      - name: Reject whitespace errors
        run: git diff --check
